<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TCG Speed Shipper — Label Generator</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>TCG Speed Shipper</h1>
    <nav class="site-nav">
      <a href="index.html" class="active">Label Generator</a>
      <a href="import.html">Paste Addresses</a>
    </nav>
  </header>

  <main>
    <section class="panel no-print">
      <h2>Ship From (optional)</h2>
      <p class="hint">Shown as the return address in the top-left of every label.</p>
      <div class="field-grid">
        <div class="field full">
          <label for="from-name">Name</label>
          <input type="text" id="from-name" placeholder="Your Name / Store" />
        </div>
        <div class="field full">
          <label for="from-street1">Street Address</label>
          <input type="text" id="from-street1" placeholder="123 Main St" />
        </div>
        <div class="field full">
          <label for="from-street2">Apt / Suite (optional)</label>
          <input type="text" id="from-street2" placeholder="Unit 4" />
        </div>
        <div class="field">
          <label for="from-city">City</label>
          <input type="text" id="from-city" placeholder="Springfield" />
        </div>
        <div class="field">
          <label for="from-state">State</label>
          <input type="text" id="from-state" maxlength="2" placeholder="IL" />
        </div>
        <div class="field">
          <label for="from-zip">Zip Code</label>
          <input type="text" id="from-zip" class="zip-input" placeholder="62704" />
        </div>
      </div>
    </section>

    <section class="panel no-print">
      <h2>Recipient</h2>
      <p class="hint">Add each recipient to the queue, then print the whole batch as one label per page.</p>
      <div class="field-grid">
        <div class="field full">
          <label for="to-name">Name</label>
          <input type="text" id="to-name" placeholder="Recipient Name" />
        </div>
        <div class="field full">
          <label for="to-street1">Street Address</label>
          <input type="text" id="to-street1" placeholder="456 Oak Ave" />
        </div>
        <div class="field full">
          <label for="to-street2">Apt / Suite (optional)</label>
          <input type="text" id="to-street2" placeholder="Apt 2B" />
        </div>
        <div class="field">
          <label for="to-city">City</label>
          <input type="text" id="to-city" placeholder="Chicago" />
        </div>
        <div class="field">
          <label for="to-state">State</label>
          <input type="text" id="to-state" maxlength="2" placeholder="IL" />
        </div>
        <div class="field">
          <label for="to-zip">Zip Code</label>
          <input type="text" id="to-zip" class="zip-input" placeholder="60601" />
        </div>
      </div>
      <div id="form-error" class="parse-warning parse-error" style="display:none"></div>
      <div class="button-row">
        <button type="button" class="primary" id="add-label-btn">Add Label to Queue</button>
      </div>
    </section>

    <section class="panel no-print">
      <h2>Queue</h2>
      <ul class="queue-list" id="queue-list">
        <li class="empty-state">No labels queued yet.</li>
      </ul>
      <div class="button-row">
        <button type="button" class="primary" id="print-btn" disabled>Print Labels</button>
        <button type="button" class="ghost" id="clear-btn" disabled>Clear Queue</button>
      </div>
    </section>

    <div id="label-sheet"></div>
  </main>

  <script src="js/labels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
