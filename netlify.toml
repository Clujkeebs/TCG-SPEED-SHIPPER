[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

# server.js require()s ./admin.js; the bundler normally follows that on its
# own, but listing it makes sure the admin API can never be left out of the
# deployed function.
[functions]
  included_files = ["admin.js"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Baseline security headers for every page. No full Content-Security-Policy:
# the pages rely on inline scripts plus CDN libraries, and a too-strict CSP
# would silently break label generation. frame-ancestors covers clickjacking.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# The affiliate dashboard is authenticated by a secret token in its URL: never
# send that URL anywhere as a referrer, and keep it out of search indexes.
[[headers]]
  for = "/affiliate/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

# Owner-only dashboard: the page is harmless on its own (all data comes from
# owner-gated API calls), but keep it out of search results and referrers.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
