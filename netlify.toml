[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install && node scripts/stamp-version.js"

# SUPABASE_URL is marked secret in Netlify, but it is public by design: the
# browser needs it to sign users in (it sits next to the public anon key in
# index.html and admin/index.html). Without this, Netlify's secret scan finds
# it in the built pages and fails every deploy. The real secrets
# (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, SUPABASE_SERVICE_ROLE_KEY) are
# still scanned.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# server.js require()s ./admin.js; the bundler normally follows that on its
# own, but listing it makes sure the admin API can never be left out of the
# deployed function.
[functions]
  included_files = ["admin.js"]

# Old address -> new domain. The API keeps answering on the old address
# (listed first, so it wins) so a Stripe webhook or an open browser tab that
# still points there never breaks: Stripe does not follow redirects. Every
# page, guide and blog post gets a permanent 301 to the same path on
# tcgspeedshipper.com, which also moves its Google ranking over.
[[redirects]]
  from = "https://tcg-speed-shipper.netlify.app/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://tcg-speed-shipper.netlify.app/*"
  to = "https://tcgspeedshipper.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://tcg-speed-shipper.netlify.app/*"
  to = "https://tcgspeedshipper.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tcgspeedshipper.com/*"
  to = "https://tcgspeedshipper.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Baseline security headers for every page. No full Content-Security-Policy:
# the pages rely on inline scripts plus CDN libraries, and a too-strict CSP
# would silently break label generation. frame-ancestors covers clickjacking.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# The affiliate dashboard is authenticated by a secret token in its URL: never
# send that URL anywhere as a referrer, and keep it out of search indexes.
[[headers]]
  for = "/affiliate/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

# Owner-only dashboard: the page is harmless on its own (all data comes from
# owner-gated API calls), but keep it out of search results and referrers.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# The service worker must always be re-checked so a deploy reaches everyone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Self-hosted third-party libraries. The version is in the file name, so a
# new version is a new URL and these can be cached forever.
# Which commit is live. Never cached, so the admin check always sees the truth.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
