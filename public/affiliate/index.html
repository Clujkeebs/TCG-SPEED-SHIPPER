<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner Dashboard — TCG Speed Shipper</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f0; --surface:#ffffff; --border:#e4e0d8; --text:#1c1b18; --text-secondary:#4a473e;
    --muted:#6b6960; --hint:#9e9a90; --accent:#2d6a4f; --accent-deep:#1f4d38; --accent-tint:#e9f2ec;
    --danger:#a13f34; --danger-tint:#f8ece9; --radius:12px; --shadow-sm:0 1px 3px rgba(0,0,0,.06);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Source Serif 4',Georgia,serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
  .top-nav{background:var(--text);display:flex;align-items:center;height:56px;padding:0 20px;box-shadow:0 2px 12px rgba(0,0,0,.3);}
  .nav-brand{font-family:'DM Serif Display',serif;font-size:14px;font-weight:600;color:#fff;text-decoration:none;}
  .wrap{max-width:680px;margin:0 auto;padding:2.5rem 16px 4rem;}
  h1{font-family:'DM Serif Display',serif;font-size:clamp(26px,5vw,34px);font-weight:400;color:var(--text);letter-spacing:-.02em;margin-bottom:.4rem;}
  .sub{font-size:14px;color:var(--muted);margin-bottom:2rem;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem;box-shadow:var(--shadow-sm);}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1rem;}
  .stat{background:var(--surface);padding:16px;}
  .stat .n{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px;color:var(--accent-deep);font-variant-numeric:tabular-nums;}
  .stat .l{font-size:11px;color:var(--hint);margin-top:4px;}
  .section-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--hint);margin-bottom:10px;}
  .link-row{display:flex;gap:8px;margin-bottom:6px;}
  .link-row input{flex:1;font-family:'JetBrains Mono',monospace;font-size:13px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);}
  .btn{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:var(--accent);color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  .btn:hover{background:var(--accent-deep);}
  .badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:100px;}
  .badge.active{background:var(--accent-tint);color:var(--accent-deep);}
  .badge.invited{background:#f6efdb;color:#93701c;}
  .badge.ended{background:var(--danger-tint);color:var(--danger);}
  p{font-size:14px;color:var(--text-secondary);line-height:1.7;}
  .error{padding:3rem 1rem;text-align:center;color:var(--muted);}
  .loading{padding:3rem 1rem;text-align:center;color:var(--hint);font-family:'JetBrains Mono',monospace;font-size:13px;}
  footer{margin-top:2.5rem;padding-top:1.25rem;border-top:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--hint);text-align:center;}
  footer a{color:var(--muted);}
</style>
</head>
<body>

<nav class="top-nav"><a href="/" class="nav-brand">TCG Speed Shipper</a></nav>

<div class="wrap" id="app">
  <div class="loading">Loading your dashboard…</div>
</div>

<footer><a href="/">← tcg-speed-shipper.netlify.app</a></footer>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var app = document.getElementById('app');

  function money(cents) {
    return '$' + (cents / 100).toFixed(2);
  }
  function esc(s) {
    var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML;
  }
  function fmtDate(d) {
    if (!d) return '—';
    try { return new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); }
    catch (e) { return d; }
  }

  if (!token) {
    app.innerHTML = '<div class="error"><p>This page needs the link from your partnership email — it won\'t work without the token in the URL.</p></div>';
    return;
  }

  fetch('/api/affiliate-dashboard?token=' + encodeURIComponent(token))
    .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
    .then(function (r) {
      if (!r.ok) {
        app.innerHTML = '<div class="error"><p>' + esc(r.body.error || 'Could not load this dashboard.') + ' Double check the link from your email, or reply to it if you think this is a mistake.</p></div>';
        return;
      }
      var d = r.body;
      var link = window.location.origin + '/?aff=' + d.affiliate_code;
      var pct = Math.round((d.commission_rate || 0) * 100);

      app.innerHTML =
        '<h1>' + esc(d.name) + '</h1>' +
        '<p class="sub">Partner dashboard · <span class="badge ' + esc(d.status) + '">' + esc(d.status) + '</span></p>' +

        '<div class="stats">' +
          '<div class="stat"><div class="n">' + d.referred_signups + '</div><div class="l">signups via your link</div></div>' +
          '<div class="stat"><div class="n">' + d.referred_paying_customers + '</div><div class="l">became paying customers</div></div>' +
          '<div class="stat"><div class="n">' + pct + '%</div><div class="l">your commission rate</div></div>' +
          '<div class="stat"><div class="n">' + money(d.owed_cents) + '</div><div class="l">owed, next payout</div></div>' +
        '</div>' +

        '<div class="card">' +
          '<div class="section-label">Your link</div>' +
          '<div class="link-row"><input type="text" readonly value="' + esc(link) + '" id="aff-link" onclick="this.select();"><button class="btn" id="copy-btn">Copy</button></div>' +
          '<p>Code: <strong style="font-family:\'JetBrains Mono\',monospace;">' + esc(d.affiliate_code) + '</strong></p>' +
        '</div>' +

        '<div class="card">' +
          '<div class="section-label">Earnings</div>' +
          '<p><strong>' + money(d.owed_cents) + '</strong> owed to you right now, paid out monthly.</p>' +
          '<p><strong>' + money(d.paid_cents) + '</strong> paid to you so far.</p>' +
          '<p style="margin-top:8px;color:var(--hint);font-size:12.5px;">Commission is 30% of every payment anyone who signed up through your link makes, for as long as they stay subscribed — not just their first month.</p>' +
        '</div>' +

        (d.status === 'active'
          ? '<div class="card"><div class="section-label">Your agreement</div><p>Active from <strong>' + fmtDate(d.agreement_start) + '</strong> to <strong>' + fmtDate(d.agreement_end) + '</strong>.' +
            (d.free_until ? ' Your own account is free through <strong>' + fmtDate(d.free_until) + '</strong>.' : '') + '</p></div>'
          : '<div class="card"><div class="section-label">Status</div><p>Your partnership isn\'t active yet — reply to the original email to get set up, or reach out if you\'re ready to go.</p></div>');

      var copyBtn = document.getElementById('copy-btn');
      if (copyBtn) {
        copyBtn.addEventListener('click', function () {
          var input = document.getElementById('aff-link');
          var orig = copyBtn.textContent;
          function done(text) { copyBtn.textContent = text; setTimeout(function () { copyBtn.textContent = orig; }, 1800); }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(input.value).then(function () { done('Copied!'); }).catch(function () { input.select(); done('Select to copy'); });
          } else {
            input.select(); done('Select to copy');
          }
        });
      }
    })
    .catch(function () {
      app.innerHTML = '<div class="error"><p>Could not reach the server right now. Try again in a moment.</p></div>';
    });
})();
</script>

</body>
</html>
