<title>Shipper HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a shipping-label control desk. Sticky progress strip, tabbed body, task "labels" that expand, chat dock. */
:root{
  --bg:#eef1f6; --paper:#ffffff; --ink:#14213d; --muted:#5b6782; --line:#d5dbe7;
  --accent:#1f47c4; --accent-soft:#e3e9fb; --stamp:#c8372d; --ok:#1d7a4c; --ok-soft:#dff2e8; --warn:#a86400; --warn-soft:#fbefd9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --paper:#161e33; --ink:#e7ecf7; --muted:#9aa6c2; --line:#2a3552;
  --accent:#7d9bff; --accent-soft:#1e2a4d; --stamp:#ff7a6e; --ok:#5fd29a; --ok-soft:#173828; --warn:#f2b45a; --warn-soft:#3a2c13; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1424; --paper:#161e33; --ink:#e7ecf7; --muted:#9aa6c2; --line:#2a3552;
  --accent:#7d9bff; --accent-soft:#1e2a4d; --stamp:#ff7a6e; --ok:#5fd29a; --ok-soft:#173828; --warn:#f2b45a; --warn-soft:#3a2c13; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
h1,h2,h3{font-family:var(--display);font-stretch:85%;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:700}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.sync{font:12px var(--mono);color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.off{background:var(--warn)}

.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.meter{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar{flex:1 1 220px;height:10px;background:var(--line);border-radius:99px;overflow:hidden;min-width:0}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.meter b{font:600 14px var(--mono);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.tab{border:1px solid var(--line);background:var(--paper);padding:7px 12px;border-radius:99px;font-weight:600;font-size:13px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.next{background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);padding:16px;display:grid;gap:8px;margin:16px 0}
.next .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

section.stage{margin-top:28px}
.stage-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.stage-sub{color:var(--muted);margin:2px 0 10px;max-width:65ch}
.stage-count{font:12px var(--mono);color:var(--muted)}

.task{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.task.done{opacity:.72}
.task.done .t-title{text-decoration:line-through;text-decoration-color:var(--muted)}
.t-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 14px}
.check{appearance:none;width:24px;height:24px;border:2px solid var(--ink);border-radius:4px;margin:1px 0 0;display:grid;place-items:center;background:var(--paper)}
.check:checked{background:var(--ok);border-color:var(--ok)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--paper);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.t-main{min-width:0}
.t-title{font-weight:600;background:none;border:0;padding:0;text-align:left;display:block;width:100%}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.tag{font:500 11px/1 var(--mono);padding:4px 6px;border-radius:4px;background:var(--bg);color:var(--muted)}
.tag.hot{background:var(--stamp);color:#fff}
.tag.money{background:var(--warn-soft);color:var(--warn)}
.tag.time{background:var(--accent-soft);color:var(--accent)}
.tag.id{background:transparent;border:1px solid var(--line)}
.expand{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px;transition:transform .2s}
.task[open-state="1"] .expand{transform:rotate(90deg)}
.t-body{padding:0 14px 14px 50px;display:grid;gap:12px}
.t-body[hidden]{display:none!important}
.why{border-left:3px solid var(--accent);padding-left:10px;color:var(--ink)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.steps li{padding-left:2px}
.unlock{font-size:13px;color:var(--ok);background:var(--ok-soft);padding:8px 10px;border-radius:4px}
.copy{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--bg);border:1px dashed var(--line);border-radius:4px;padding:6px 8px;font:13px var(--mono);word-break:break-all}
.copy code{flex:1 1 200px;min-width:0}
.copy button,.btn{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:4px 10px;font-size:12px;font-weight:600}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.note{width:100%;min-height:54px;border:1px solid var(--line);border-radius:4px;padding:8px;background:var(--bg);resize:vertical}
.note-row{display:grid;gap:4px}
.note-row label{font-size:12px;color:var(--muted)}
.t-actions{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:520px){.t-body{padding-left:14px}}

.explainer{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;margin-top:12px}
.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.lane{border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;gap:6px;align-content:start}
.lane .eyebrow{color:var(--accent)}
.lane.now{border-color:var(--ok);box-shadow:inset 0 3px 0 var(--ok)}

table{border-collapse:collapse;width:100%;font-size:14px}
.tbl{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.phase{margin-top:22px}
.phase h3{margin-bottom:8px}

.ladder{display:grid;gap:10px;margin-top:12px}
.rung{display:grid;grid-template-columns:110px 1fr;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.rung .amt{font:800 26px/1 var(--display);font-stretch:80%}
.rung.here{border-color:var(--ok)}
@media (max-width:520px){.rung{grid-template-columns:1fr}}

/* chat dock */
.dock-btn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--paper);border:0;border-radius:99px;padding:12px 18px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.dock{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:21;width:min(420px,calc(100vw - 32px));height:min(600px,calc(100vh - 120px));background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;overflow:hidden}
.dock header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.dock-tabs{display:flex;gap:4px}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:grid;gap:10px;align-content:start}
.msg{padding:9px 11px;border-radius:8px;max-width:92%;white-space:pre-wrap;word-wrap:break-word;font-size:14px}
.msg.me{background:var(--accent);color:#fff;justify-self:end}
.msg.ai{background:var(--bg);justify-self:start}
.msg.sys{background:transparent;color:var(--muted);font-size:12px;justify-self:center;text-align:center}
.msg small{display:block;opacity:.7;font-size:11px;margin-top:4px}
.composer{border-top:1px solid var(--line);padding:10px;display:grid;gap:6px}
.composer textarea{width:100%;min-height:58px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--bg);resize:none}
.composer .row{display:flex;gap:6px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px}
@media (min-width:1100px){
  body{padding-right:380px}
  .dock{position:fixed;top:0;right:0;bottom:0;width:364px;height:auto;border-radius:0;border-width:0 0 0 1px;box-shadow:none;padding-top:env(safe-area-inset-top,0px)}
  .dock[hidden]{display:flex!important}
  .dock-btn,#dockClose{display:none}
}
.dock h3{font-size:16px}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 10px;font-size:12px}
.inbox-link{background:none;border:0;padding:0;color:var(--accent);font-size:12px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">TCG Speed Shipper · owner desk</div>
      <h1>Shipper HQ</h1>
      <div style="color:var(--muted);max-width:60ch;margin-top:6px">Everything only you can do, in order, with the exact clicks. Tick a task and Claude sees it. Leave a note on any task, or use the <b>Quick questions</b> chat.</div>
    </div>
    <div class="sync"><span class="dot" id="syncDot"></span><span id="syncText">Connecting…</span></div>
  </header>

  <div class="strip">
    <div class="meter"><div class="bar"><i id="barFill"></i></div><b id="countText">0 / 0 done</b></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="todo" aria-selected="true">Your to-do</button>
      <button class="tab" role="tab" data-tab="pb" aria-selected="false">Pitney Bowes guide</button>
      <button class="tab" role="tab" data-tab="build" aria-selected="false">What we're building</button>
      <button class="tab" role="tab" data-tab="money" aria-selected="false">Money ladder</button>
    </div>
  </div>

  <main>
    <div id="tab-todo">
      <div class="next" id="nextCard"></div>
      <div class="filters" id="filters">
        <button class="chip" data-f="open" aria-pressed="true">Not done</button>
        <button class="chip" data-f="all" aria-pressed="false">All</button>
        <button class="chip" data-f="quick" aria-pressed="false">Under 5 min</button>
        <button class="chip" data-f="hot" aria-pressed="false">Do first</button>
        <button class="chip" data-f="done" aria-pressed="false">Done</button>
      </div>
      <div id="stages"></div>
    </div>

    <div id="tab-pb" hidden></div>
    <div id="tab-build" hidden></div>
    <div id="tab-money" hidden></div>
  </main>
</div>

<button class="dock-btn" id="dockBtn">Ask a question</button>
<div class="dock" id="dock" hidden>
  <header>
    <h3 id="dockTitle">Quick questions</h3>
    <button class="btn" id="dockClose">Close</button>
  </header>
  <div class="msgs" id="askMsgs"></div>
  <div class="quick" id="quickAsk">
    <button>Where's the Shipper ID?</button>
    <button>What do I do first?</button>
    <button>Do I need to pay for sandbox?</button>
  </div>
  <div class="msgs" id="inboxMsgs" hidden></div>
  <div class="composer">
    <textarea id="composer" placeholder="Ask anything: “where is the Shipper ID?”, “what do I do after Railway?”"></textarea>
    <div class="row">
      <button class="inbox-link" id="modeLink">Send to Claude's inbox instead</button>
      <button class="btn primary" id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
/* ---------- Content ---------- */
const TXT_VALUE = "railway-verify=2f07e30030ad12a6fcee1329ee23f25808e97b6b21a9f09803683a6ba50dbf54";
const STAGES = [
 {id:"A", name:"Switch on postage", sub:"This is the money. Today we earn once a month per seller. With postage we earn on every label every seller prints. Rob alone ships 500+ orders a month.", tasks:[
  {id:"A1", hot:1, min:15, title:"Put the Pitney Bowes sandbox keys into Railway",
   why:"Turns on the Buy postage panel in TEST MODE. Test labels are free and fake, so nothing is charged and no payment setup is needed. Claude can then test against real Pitney Bowes responses and fix anything before real money moves.",
   steps:[
    "In the Pitney Bowes Developer Hub, open <b>API Keys</b> (Sandbox). In the row with STATUS = Active, copy the <b>Client ID</b>. Click the eye/Show icon under <b>SECRET</b> and copy that too. No row? Click <b>Generate Key</b>.",
    "Open the <b>Merchants</b> page (may say <b>Onboarding Merchants</b>). Your account comes with one free test merchant already listed, often marked Default. Copy the value in its <b>Shipper ID</b> column. <b>Do not click Invite Merchant</b> (see the Pitney Bowes guide tab for what it's for).",
    "If the Merchants page is empty except for the Invite Merchant button, write that in this task's note. Claude will find another way to get the Shipper ID.",
    "Go to <b>railway.app</b> → project <b>tcg-speed-shipper</b> → click the <b>web</b> box → <b>Variables</b> tab → <b>+ New Variable</b>.",
    "Add three variables, name on the left, value on the right: <span class='mono'>PB_API_KEY</span> = Client ID, <span class='mono'>PB_API_SECRET</span> = Secret, <span class='mono'>PB_SHIPPER_ID</span> = Shipper ID.",
    "Click the purple <b>Deploy</b> button at the top. The site restarts in about 2 minutes with no downtime.",
    "Check it: log into tcgspeedshipper.com, click <b>Try a sample</b>. A <b>Buy postage</b> panel with a yellow TEST MODE badge appears. Buy one test label.",
    "Never paste these keys in chat, email or this page. Railway is the only place they go."],
   copy:["PB_API_KEY","PB_API_SECRET","PB_SHIPPER_ID"],
   unlock:"Postage works end to end in test mode. Claude starts fixing anything Pitney Bowes rejects."},
  {id:"A2", hot:1, min:1, title:"Decide the Ground Advantage fee ($0.30 or $0.50)",
   why:"This is what we add on top of postage for $49.99+ orders that need a tracked package label. At $0.30 we keep only $0.08–0.21 after payment fees. At $0.50 we keep $0.28–0.41 and the seller still pays about $5 total.",
   steps:["Recommendation: <b>$0.50</b>. Letters stay $0.21 (seller pays $0.99 for a tracked letter, cheaper than a stamp plus tracking).","Write “ground 50” (or your number) in this task's note, or in the Inbox. Claude changes it."],
   unlock:"Each package label makes real money."},
  {id:"A3", min:3, title:"Let Rob test postage and send his invite",
   why:"Rob pays $30/mo to rent a postage meter and said he'd drop it for this. He's the first proof sellers will pay per label, and his feedback shapes it for the next 100.",
   steps:["Railway → web → Variables → add <span class='mono'>PB_PILOT_EMAILS</span> = the email Rob uses to log into tcgspeedshipper.com. More than one person? Separate with commas.","Only you and the emails in that list see the postage panel. Everyone else sees nothing new.","Open Gmail → Rob's thread → a draft reply from you invites him to test. Read it, edit, send."],
   copy:["PB_PILOT_EMAILS"], unlock:"Your first real postage customer."},
  {id:"A4", min:10, title:"Production access from Pitney Bowes (you emailed them)",
   why:"Sandbox labels are fake. Production prints real USPS postage. Pitney Bowes has to approve it and will ask how postage gets paid for.",
   steps:["When they reply, ask for <b>Individual Postage Accounts</b> if possible: each seller connects their own card to Pitney Bowes and PB charges them for postage directly. You never front anyone's postage.","The other model is a <b>Bulk account</b>: all postage is charged to your PB account and we bill sellers from the prepaid balance (already built). More margin, more risk.","Also ask: “Do you offer a platform revenue share or volume pricing on First-Class letters with IMb tracking?” That's how eBay gets cheaper envelopes.","They'll need a payment method on your PB account for production. Add it when they ask.","Paste their answer in this task's note. Claude updates the code for the model they approve."],
   unlock:"Real postage, real per-label revenue."},
  {id:"A5", min:5, title:"Two Stripe settings for the prepaid balance",
   why:"Sellers add $20/$50/$100 to a balance once instead of paying at checkout every label. Bank payments cost 0.8% instead of about 3% for cards, which matters on small per-label fees.",
   steps:["dashboard.stripe.com → <b>Settings</b> (gear) → <b>Payment methods</b> → <b>ACH Direct Debit</b> (or “US bank account”) → Turn on.","<b>Developers</b> → <b>Webhooks</b> → click the endpoint ending in <span class='mono'>/api/stripe-webhook</span> → <b>Add events</b> → search and tick the event below → Save.","Why the event: bank payments clear in 3–5 days. This tells our server when the money lands, so the balance is credited automatically."],
   copy:["checkout.session.async_payment_succeeded"], unlock:"Cheaper top-ups, automatic crediting."},
  {id:"A6", money:1, min:60, title:"Form an LLC before real postage goes live",
   why:"Once sellers prepay balances you're holding their money. An LLC keeps your personal savings separate if something goes wrong (chargebacks, disputes, a Pitney Bowes bill).",
   steps:["California: file Articles of Organization (Form LLC-1) at <b>bizfileonline.sos.ca.gov</b>. State fee $70.","California charges an $800/yr franchise tax. Ask an accountant about first-year rules.","Get a free EIN at <b>irs.gov</b> (10 minutes online), then open a business bank account.","Update Stripe (Settings → Business details) and Pitney Bowes to the LLC."],
   unlock:"Safe to switch on production postage."},
  {id:"A7", min:20, title:"Apply for a USPS Mailer ID (free, slow)",
   why:"Lets us print USPS's tracking barcode on the free #10 envelope format, so sellers who use stamps still get Accepted / In transit / Delivered scans. Three competitors charge for this.",
   steps:["<b>gateway.usps.com</b> → Register for a Business Customer Gateway account.","After login: <b>Mailing Services</b> → request a <b>Mailer ID (MID)</b> and <b>Informed Visibility</b> access.","Approval takes a few weeks. Tick this when you've applied, note when approved."],
   unlock:"Free envelope tracking for every seller."}
 ]},
 {id:"B", name:"Fix and secure", sub:"One evening, about 40 minutes total. These protect the business.", tasks:[
  {id:"B1", hot:1, min:2, title:"Finish www.tcgspeedshipper.com (one DNS record)",
   why:"Anyone who types “www.” gets a security warning right now and leaves.",
   steps:["porkbun.com → Account → <b>Domain Management</b> → next to tcgspeedshipper.com click <b>DNS</b>.","Add a record: Type <b>TXT</b>, Host and Answer below. Save.","Railway sees it within an hour and issues the certificate by itself."],
   copy:["_railway-verify.www", TXT_VALUE], unlock:"www works with no warning."},
  {id:"B2", min:1, title:"Delete the Steel API key",
   why:"It was pasted in chat, so treat it as exposed. We don't use Steel anymore.",
   steps:["app.steel.dev → <b>Settings</b> → <b>API Keys</b> → trash icon on the key."]},
  {id:"B3", min:1, title:"Delete the old Stripe secret key",
   why:"An old key that still works can do anything in your Stripe account.",
   steps:["Stripe → <b>Developers</b> → <b>API keys</b>. Under Secret keys, keep the one named <b>Railway</b>.","On the other one: <b>⋯</b> → Delete (or Roll / Expire)."]},
  {id:"B4", min:5, title:"Roll the Supabase service-role key",
   why:"It was readable by tools connected to the old Netlify setup, and it can read every user's data.",
   steps:["supabase.com → project “vischeck” → <b>Project Settings</b> → <b>API Keys</b> → service_role → <b>Roll</b>. Copy the new key.","Railway → web → Variables → edit <span class='mono'>SUPABASE_SERVICE_ROLE_KEY</span> → paste → Deploy.","Do it late at night: logins may error for about 2 minutes in between."],
   copy:["SUPABASE_SERVICE_ROLE_KEY"]},
  {id:"B5", min:1, title:"Turn on leaked-password protection",
   why:"Blocks passwords that showed up in public data breaches.",
   steps:["Supabase → <b>Authentication</b> → <b>Attack Protection</b> (or Policies) → turn on <b>Leaked password protection</b>."]},
  {id:"B6", min:15, title:"Two-factor login on every account",
   why:"If someone gets into your Gmail, they can reset everything else. This is the business.",
   steps:["Install Google Authenticator or Authy on your phone.","Turn on 2FA in account security for: GitHub, Railway, Porkbun, Stripe, Supabase, Gmail, Pitney Bowes.","Save each set of backup codes somewhere offline."]},
  {id:"B7", min:5, title:"Uptime alert to your phone",
   why:"If the site goes down at 2 a.m., you know before customers do.",
   steps:["uptimerobot.com → free account → <b>New monitor</b> → type HTTP(s).","URL below, interval 5 minutes, alert contact: your phone (install the UptimeRobot app for push alerts)."],
   copy:["https://tcgspeedshipper.com/api/health"]}
 ]},
 {id:"C", name:"Decisions only you can make", sub:"Answer in the task note. Ten seconds each.", tasks:[

let filter = "open";
const openSet = new Set();
let db = null, sample = null;
const local = { get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
progress = local.get("hq-progress") || {};
filter = local.get("hq-filter") || "open";

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isDone = id => !!(progress[id] && progress[id].done);

/* ---------- Render: to-do ---------- */
function timeLabel(m){ return m >= 60 ? (m/60)+" hr" : m+" min"; }
function taskHTML(t){
  const p = progress[t.id] || {};
  const open = openSet.has(t.id);
  return `<article class="task ${p.done?"done":""}" data-id="${t.id}" open-state="${open?1:0}">
    <div class="t-head">
      <input type="checkbox" class="check" id="chk-${t.id}" aria-label="Mark ${esc(t.title)} done" ${p.done?"checked":""}>
      <div class="t-main">
        <button class="t-title" data-toggle="${t.id}">${esc(t.title)}</button>
        <div class="t-meta">
          <span class="tag id">${t.id}</span>
          ${t.hot?'<span class="tag hot">Do first</span>':""}
          <span class="tag time">${timeLabel(t.min)}</span>
          ${t.money?'<span class="tag money">costs money</span>':""}
          ${p.note?'<span class="tag">has note</span>':""}
        </div>
      </div>
      <button class="expand" data-toggle="${t.id}" aria-label="Show steps">›</button>
    </div>
    <div class="t-body" ${open?"":"hidden"}>
      <div class="why">${t.why}</div>
      <ol class="steps">${t.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
      ${(t.copy||[]).map(c=>`<div class="copy"><code>${esc(c)}</code><button data-copy="${esc(c)}">Copy</button></div>`).join("")}
      ${t.unlock?`<div class="unlock"><b>Unlocks:</b> ${t.unlock}</div>`:""}
      <div class="note-row">
        <label for="note-${t.id}">Note to Claude (saved, Claude reads these)</label>
        <textarea class="note" id="note-${t.id}" data-note="${t.id}" placeholder="Stuck? Done differently? Write it here.">${esc(p.note||"")}</textarea>
      </div>
      <div class="t-actions">
        <button class="btn" data-ask="${t.id}">Ask Claude about this</button>
      </div>
    </div>
  </article>`;
}
function visible(t){
  const d = isDone(t.id);
  if (filter==="open") return !d;
  if (filter==="done") return d;
  if (filter==="quick") return !d && t.min<=5;
  if (filter==="hot") return !d && t.hot;
  return true;
}
function renderTodo(){
  const host = $("#stages");
  host.innerHTML = STAGES.map(s=>{
    const vis = s.tasks.filter(visible);
    const done = s.tasks.filter(t=>isDone(t.id)).length;
    if (!vis.length) return "";
    return `<section class="stage"><div class="stage-head"><h2>${s.id} · ${esc(s.name)}</h2><span class="stage-count">${done}/${s.tasks.length} done</span></div>
      <p class="stage-sub">${esc(s.sub)}</p>${vis.map(taskHTML).join("")}</section>`;
  }).join("") || `<div class="empty">Nothing here for this filter. ${filter==="done"?"Tick a task and it shows up here.":"Everything in this view is done. 🎉"}</div>`;
  document.querySelectorAll("#filters .chip").forEach(c=>c.setAttribute("aria-pressed", c.dataset.f===filter));
  renderMeter(); renderNext();
}
function renderMeter(){
  const d = ALL.filter(t=>isDone(t.id)).length;
  $("#barFill").style.width = (d/ALL.length*100)+"%";
  $("#countText").textContent = `${d} / ${ALL.length} done`;
}
function renderNext(){
  const n = ALL.find(t=>t.hot && !isDone(t.id)) || ALL.find(t=>!isDone(t.id));
  const c = $("#nextCard");
  if (!n){ c.innerHTML = `<div class="eyebrow">Next up</div><h3>Every task is done.</h3>`; return; }
  c.innerHTML = `<div class="eyebrow">Next up · ${timeLabel(n.min)}</div>
    <div class="row"><h3 style="min-width:0">${esc(n.title)}</h3><button class="btn primary" data-jump="${n.id}">Show me how</button></div>
    <div style="color:var(--muted)">${n.why}</div>`;
}

/* ---------- Events ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-toggle]");
  if (t){ const id=t.dataset.toggle; openSet.has(id)?openSet.delete(id):openSet.add(id); renderTodo(); return; }
  const j = e.target.closest("[data-jump]");
  if (j){ const id=j.dataset.jump; openSet.add(id); filter="all"; renderTodo(); document.querySelector(`[data-id="${id}"]`)?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const c = e.target.closest("[data-copy]");
  if (c){ const v=c.dataset.copy; navigator.clipboard?.writeText(v).then(()=>{c.textContent="Copied";setTimeout(()=>c.textContent="Copy",1400)}).catch(()=>{const r=document.createRange();r.selectNodeContents(c.previousElementSibling);const s=getSelection();s.removeAllRanges();s.addRange(r);c.textContent="Selected";}); return; }
  const f = e.target.closest("[data-f]");
  if (f){ filter=f.dataset.f; local.set("hq-filter",filter); renderTodo(); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab){ document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected", b===tab)); ["todo","pb","build","money"].forEach(n=>$("#tab-"+n).hidden = n!==tab.dataset.tab); if(tab.dataset.tab==="build") renderBuild(); return; }
  const a = e.target.closest("[data-ask]");
  if (a){ const tk=ALL.find(x=>x.id===a.dataset.ask); openDock("ask"); $("#composer").value=`About ${tk.id} (“${tk.title}”): `; $("#composer").focus(); return; }
});
document.addEventListener("change", e=>{
  if (e.target.classList.contains("check")){
    const id = e.target.id.slice(4);
    setProgress(id, {done:e.target.checked});
    renderTodo();
  }
});
const noteTimers = {};
document.addEventListener("input", e=>{
  const id = e.target.dataset && e.target.dataset.note;
  if (!id) return;
  clearTimeout(noteTimers[id]);
  noteTimers[id] = setTimeout(()=>setProgress(id,{note:e.target.value}), 900);
});
function setProgress(id, patch){
  progress[id] = {...(progress[id]||{}), ...patch};
  local.set("hq-progress", progress);
  if (db) db.doc("progress/"+id).set({done:!!progress[id].done, note:progress[id].note||"", at:new Date().toISOString()}).catch(()=>setSync(false,"Saved on this device only"));
}

/* ---------- Sync ---------- */
function setSync(on, text){ $("#syncDot").className = "dot "+(on?"on":"off"); $("#syncText").textContent = text; }
(async ()=>{
  try { db = await window.claude?.use?.("db"); } catch(e){ db = null; }
  if (!db){ setSync(false,"Saved on this device only"); return; }
  setSync(true,"Synced with Claude");
  db.collection("progress").onSnapshot(snap=>{
    snap.docs.forEach(d=>{ const v=d.data()||{}; progress[d.id]={done:!!v.done, note:v.note||""}; });
    local.set("hq-progress", progress);
    const active = document.activeElement;
    if (active && active.dataset && active.dataset.note) { renderMeter(); renderNext(); return; }
    renderTodo();
  }, ()=>setSync(false,"Sync paused"));
  db.collection("inbox").orderBy("at","asc").limit(200).onSnapshot(snap=>{
    inbox = snap.docs.map(d=>({id:d.id, ...(d.data()||{})}));
    renderInbox();
  }, ()=>{});
})();

  const d = document.createElement("div"); d.className = "msg "+cls; d.textContent = text;

  host.appendChild(d); host.scrollTop = host.scrollHeight; return d;
}

function context(){
  const lines = STAGES.map(s=>`Stage ${s.id} ${s.name}:\n`+s.tasks.map(t=>{
    const p=progress[t.id]||{};
    const strip = x=>x.replace(/<[^>]+>/g,"");
    return `- ${t.id} [${p.done?"DONE":"todo"}] ${t.title}. Why: ${strip(t.why)} Steps: ${t.steps.map(strip).join(" | ")}${t.copy?" Values: "+t.copy.join(", "):""}${p.note?" Owner note: "+p.note:""}`;
  }).join("\n")).join("\n\n");
  return `You are the helper inside "Shipper HQ", the owner's to-do board for TCG Speed Shipper (tcgspeedshipper.com), a web app that turns TCGplayer order CSVs into shipping labels, envelopes and packing slips, now adding Pitney Bowes postage with a per-label fee and a prepaid balance (Stripe). Hosting: Railway (auto-deploys on merge). Database/auth: Supabase. DNS: Porkbun. The owner (Sam) is not technical and uses an iPad. Answer in 1-4 short sentences, plainly, with exact click paths and the task id (like A1) when relevant. Never ask for or repeat secret values (keys, secrets, passwords); tell him to paste secrets only into Railway Variables. If something needs code changes or a decision recorded, tell him to send it via the Inbox tab, which goes to the Claude that builds the app.

Pitney Bowes facts: Client ID = PB_API_KEY, Secret = PB_API_SECRET, Shipper ID (Merchants / Onboarding Merchants page, the default test merchant that comes with the developer account) = PB_SHIPPER_ID. Sandbox needs no payment setup; test labels are free and fake. "Invite Merchant" emails a seller to create their own PB postage account (individual-account model, production) and should not be used now. Production needs PB approval, a payment method, and the app setting PB_ENV=production plus PB_LIVE_OK=yes (Claude handles that after the LLC). PB_PILOT_EMAILS = comma-separated login emails of sellers allowed to see the postage panel during the pilot.

Current tasks and progress:
${lines}`;
}

async function send(){
  const text = $("#composer").value.trim();
  if (!text || busy) return;
  $("#composer").value = "";
  if (dockMode==="inbox"){
    if (!db){ bubble($("#inboxMsgs"),"sys","Inbox needs sync, which isn't available in this view. Use Ask now, or write a task note."); return; }
    try { await db.collection("inbox").add({from:"owner", text, at:new Date().toISOString()}); }
    catch(e){ bubble($("#inboxMsgs"),"sys","Couldn't send. Check your connection and try again."); $("#composer").value=text; }
    return;
  }
  const h = $("#askMsgs");
  bubble(h,"me",text);
  if (sample===null || sample===undefined){
    try { sample = await window.claude?.use?.("sample"); } catch(e){ sample = null; }
  }
  if (!sample){ bubble(h,"sys","Live answers aren't available in this view. Send it to the Inbox instead and Claude will reply there."); return; }
  askHistory.push({role:"user", content:text});
  const out = bubble(h,"ai","Thinking…");
  busy = true; $("#sendBtn").disabled = true;
  try{
    const turns = askHistory.slice(-10);
    turns[0] = {role:"user", content: context()+"\n\n---\nOwner's question:\n"+turns[0].content};
    const res = await sample(turns, {cache:false, onText:u=>{ out.textContent=u.text; h.scrollTop=h.scrollHeight; }});
    out.textContent = res.text;
    askHistory.push({role:"assistant", content:res.text});
  }catch(e){
    const msg = {not_granted:"Live answers weren't allowed. You can turn them on from this page's Permissions menu, or use the Inbox.", rate_limited:"Too many questions at once. Wait a minute and try again.", prompt_too_large:"That conversation got long. Close and reopen the chat to start fresh."}[e&&e.code];
    out.textContent = (e&&e.text) || msg || "Couldn't get an answer. Try again, or send it to the Inbox.";
    askHistory.pop();
  }finally{ busy=false; $("#sendBtn").disabled=false; }
}
