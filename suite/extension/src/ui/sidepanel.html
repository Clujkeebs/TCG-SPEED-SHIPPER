<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCG Speed Agent</title>
<style>
body{font:14px system-ui,sans-serif;margin:0;display:flex;flex-direction:column;height:100vh;color:#1d1d1f}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid #ddd}
#stop{background:#b00020;color:#fff;border:0;border-radius:6px;padding:6px 12px;font-weight:600}
#resume{padding:6px 12px}
#practice{background:#fff7e0;border-bottom:1px solid #ecd9a0;padding:6px 12px;font-size:12px}
main{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
section h2{font-size:13px;margin:0 0 4px;color:#555;text-transform:uppercase;letter-spacing:.04em}
#plan ol{margin:0;padding-left:20px}#plan li.done{color:#2a7a3b}#plan li.doing{font-weight:600}#plan li.skipped{color:#888;text-decoration:line-through}
.msg{padding:8px 10px;border-radius:8px;white-space:pre-wrap}.user{background:#e8f0fe}.answer{background:#f2f2f2}.progress{font-size:12px;color:#555}.notice{background:#fde8e8}
.card{border:2px solid #c97a00;border-radius:8px;padding:10px;background:#fffaf0}.card h3{font-size:14px;margin:0 0 6px}
.card dl{margin:6px 0}.card dt{font-weight:600;float:left;clear:left;margin-right:6px}.card dd{margin:0 0 2px}.card button{margin-right:8px;padding:6px 12px}
#memory ul{list-style:none;padding:0;margin:0}#memory li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid #eee}
form{display:flex;flex-direction:column;gap:6px;padding:10px;border-top:1px solid #ddd}form textarea{padding:8px;font:inherit}
#off,#offline{padding:16px}
</style></head>
<body>
<header><strong>TCG Speed Agent</strong><span><button id="resume" hidden>Resume</button> <button id="stop">Stop</button></span></header>
<div id="off" hidden>The Agent panel is switched off. Turn it on in Settings (click the extension icon, then Settings).</div>
<div id="offline" hidden>The agent is not answering right now.</div>
<div id="practice" hidden>Practice mode: made-up data. Nothing here is real and nothing is changed.</div>
<main id="body" hidden>
  <section id="plan" hidden><h2>Plan</h2><ol id="planlist"></ol></section>
  <section id="log" role="log" aria-live="polite"></section>
  <section id="memory" hidden><h2>What I remember about your shop</h2><ul id="memlist"></ul></section>
</main>
<form id="form" hidden><label for="goal"><strong>What do you want done?</strong></label>
<textarea id="goal" rows="2" maxlength="2000" placeholder="For example: lower my prices a little"></textarea><button id="go">Start</button></form>
<script type="module" src="sidepanel.js"></script>
</body></html>
